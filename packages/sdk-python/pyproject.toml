[project]
name = "hexvault"
version = "2.1.0"
description = "Python client for HEXVault REST API"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sawon2026" }]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexvault*"]
