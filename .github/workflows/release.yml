name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install & build
        run: |
          npm ci || npm install
          npm run build || true

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HEXVault ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## HEXVault ${{ steps.ver.outputs.version }}

            Intelligent Project Memory Vault + Smart PR Reviewer.

            See [README](https://github.com/sawon2026/HEXVault#readme) for setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
