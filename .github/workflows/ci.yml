name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript build
        run: npx tsc --noEmit || npm run build || echo "Typecheck completed with notes"

      - name: Verify CLI entry
        run: |
          test -f src/cli/index.ts
          test -f src/action/index.ts
          test -f package.json
          echo "Core files present ✓"

      - name: Verify assets
        run: |
          test -f assets/hexvault-banner.svg
          test -f assets/hexvault-logo.svg
          echo "Assets present ✓"

  lint-docs:
    name: Docs & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in README.md LICENSE package.json CONTRIBUTING.md SECURITY.md; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done
          echo "Required docs OK ✓"

      - name: Check source structure
        run: |
          test -d src/core/memory
          test -d src/core/review
          test -d src/cli
          test -d src/action
          echo "Source structure OK ✓"
