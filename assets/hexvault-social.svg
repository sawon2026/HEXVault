<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="HEXVault Social Preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <circle cx="200" cy="320" r="180" fill="#22D3EE" opacity="0.06"/>
  <circle cx="1100" cy="200" r="160" fill="#818CF8" opacity="0.08"/>

  <!-- Logo -->
  <g transform="translate(640, 220)">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"
             fill="none" stroke="url(#hex)" stroke-width="5"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"
             fill="url(#hex)" opacity="0.2"/>
    <circle cx="0" cy="-16" r="8" fill="#22D3EE"/>
    <circle cx="-24" cy="14" r="7" fill="#38BDF8"/>
    <circle cx="24" cy="14" r="7" fill="#818CF8"/>
    <line x1="0" y1="-16" x2="-24" y2="14" stroke="#67E8F9" stroke-width="2.5"/>
    <line x1="0" y1="-16" x2="24" y2="14" stroke="#A5B4FC" stroke-width="2.5"/>
    <line x1="-24" y1="14" x2="24" y2="14" stroke="#67E8F9" stroke-width="2" opacity="0.7"/>
  </g>

  <text x="640" y="380" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="72" font-weight="800" fill="#F8FAFC" letter-spacing="-2">
    HEXVault
  </text>

  <text x="640" y="440" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="26" font-weight="500" fill="#94A3B8">
    Project Memory Vault + Smart PR Reviewer
  </text>

  <rect x="480" y="470" width="320" height="4" rx="2" fill="url(#accent)"/>

  <text x="640" y="540" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="18" fill="#64748B">
    GitHub · GitLab · Bitbucket · CLI · Dashboard · AI
  </text>
</svg>
