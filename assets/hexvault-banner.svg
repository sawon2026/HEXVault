<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="HEXVault">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.5"/>

  <!-- Soft glow orbs -->
  <circle cx="180" cy="200" r="120" fill="#22D3EE" opacity="0.08"/>
  <circle cx="1020" cy="120" r="100" fill="#818CF8" opacity="0.1"/>
  <circle cx="900" cy="320" r="80" fill="#38BDF8" opacity="0.07"/>

  <!-- Hexagon logo mark -->
  <g transform="translate(160, 200)" filter="url(#glow)">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35"
             fill="none" stroke="url(#hexFill)" stroke-width="4" opacity="0.9"/>
    <polygon points="0,-48 41.6,-24 41.6,24 0,48 -41.6,24 -41.6,-24"
             fill="url(#hexFill)" opacity="0.25"/>
    <!-- Brain / memory node dots inside hex -->
    <circle cx="0" cy="-12" r="5" fill="#22D3EE"/>
    <circle cx="-18" cy="10" r="4" fill="#38BDF8"/>
    <circle cx="18" cy="10" r="4" fill="#818CF8"/>
    <line x1="0" y1="-12" x2="-18" y2="10" stroke="#67E8F9" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="-12" x2="18" y2="10" stroke="#A5B4FC" stroke-width="1.5" opacity="0.8"/>
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#67E8F9" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="280" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="72" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    HEXVault
  </text>

  <!-- Tagline -->
  <text x="280" y="230" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="24" font-weight="500" fill="#94A3B8">
    Intelligent Project Memory + Smart PR Reviewer
  </text>

  <!-- Accent line -->
  <rect x="280" y="255" width="320" height="3" rx="2" fill="url(#accent)"/>

  <!-- Feature pills -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="280" y="290" width="110" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="335" y="311" text-anchor="middle" fill="#67E8F9">Memory</text>

    <rect x="405" y="290" width="100" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="455" y="311" text-anchor="middle" fill="#A5B4FC">AI Review</text>

    <rect x="520" y="290" width="90" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="565" y="311" text-anchor="middle" fill="#7DD3FC">GitHub</text>

    <rect x="625" y="290" width="90" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
    <text x="670" y="311" text-anchor="middle" fill="#C4B5FD">CLI</text>
  </g>

  <!-- Right side abstract nodes -->
  <g opacity="0.6" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <circle cx="980" cy="140" r="8" fill="#22D3EE" opacity="0.8"/>
    <circle cx="1050" cy="180" r="6" fill="#818CF8" opacity="0.8"/>
    <circle cx="1000" cy="240" r="7" fill="#38BDF8" opacity="0.8"/>
    <circle cx="1080" cy="220" r="5" fill="#22D3EE" opacity="0.7"/>
    <circle cx="950" cy="200" r="5" fill="#A5B4FC" opacity="0.7"/>
    <line x1="980" y1="140" x2="1050" y2="180"/>
    <line x1="980" y1="140" x2="950" y2="200"/>
    <line x1="1050" y1="180" x2="1000" y2="240"/>
    <line x1="1000" y1="240" x2="1080" y2="220"/>
    <line x1="950" y1="200" x2="1000" y2="240"/>
  </g>
</svg>
