<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#bg)"/>
  <text x="40" y="48" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">CI/CD Pipelines (auto-configured)</text>
  <rect x="40" y="62" width="180" height="3" rx="2" fill="url(#accent)"/>

  <!-- Three workflow cards -->
  <rect x="40" y="100" width="260" height="320" rx="12" fill="#020617" stroke="#334155"/>
  <rect x="40" y="100" width="260" height="48" rx="12" fill="#164E63"/>
  <rect x="40" y="124" width="260" height="24" fill="#164E63"/>
  <text x="60" y="130" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#67E8F9">CI</text>
  <text x="60" y="175" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">File:</text>
  <text x="60" y="200" font-family="monospace" font-size="12" fill="#E2E8F0">.github/workflows/ci.yml</text>
  <text x="60" y="240" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Triggers:</text>
  <text x="60" y="265" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">• push to main</text>
  <text x="60" y="290" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">• every pull request</text>
  <text x="60" y="325" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Jobs:</text>
  <text x="60" y="350" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Build (Node 18/20/22)</text>
  <text x="60" y="375" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Typecheck</text>
  <text x="60" y="400" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Docs structure</text>

  <rect x="320" y="100" width="260" height="320" rx="12" fill="#020617" stroke="#334155"/>
  <rect x="320" y="100" width="260" height="48" rx="12" fill="#312E81"/>
  <rect x="320" y="124" width="260" height="24" fill="#312E81"/>
  <text x="340" y="130" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#A5B4FC">PR Review</text>
  <text x="340" y="175" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">File:</text>
  <text x="340" y="200" font-family="monospace" font-size="11" fill="#E2E8F0">hexvault-review.yml</text>
  <text x="340" y="240" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Triggers:</text>
  <text x="340" y="265" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">• PR opened</text>
  <text x="340" y="290" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">• PR updated</text>
  <text x="340" y="325" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Jobs:</text>
  <text x="340" y="350" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Load project memory</text>
  <text x="340" y="375" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ AI / rule review</text>
  <text x="340" y="400" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Comment on PR</text>

  <rect x="600" y="100" width="260" height="320" rx="12" fill="#020617" stroke="#334155"/>
  <rect x="600" y="100" width="260" height="48" rx="12" fill="#422006"/>
  <rect x="600" y="124" width="260" height="24" fill="#422006"/>
  <text x="620" y="130" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#FBBF24">Release</text>
  <text x="620" y="175" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">File:</text>
  <text x="620" y="200" font-family="monospace" font-size="12" fill="#E2E8F0">release.yml</text>
  <text x="620" y="240" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Triggers:</text>
  <text x="620" y="265" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">• git tag v*</text>
  <text x="620" y="290" font-family="system-ui,sans-serif" font-size="13" fill="#E2E8F0">  e.g. v0.4.1</text>
  <text x="620" y="325" font-family="system-ui,sans-serif" font-size="13" fill="#94A3B8">Jobs:</text>
  <text x="620" y="350" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Build project</text>
  <text x="620" y="375" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ GitHub Release</text>
  <text x="620" y="400" font-family="system-ui,sans-serif" font-size="13" fill="#4ADE80">✓ Auto notes</text>
</svg>
